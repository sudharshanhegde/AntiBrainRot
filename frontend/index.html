<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#F3F2EC" />
    <meta
      name="description"
      content="Swipe through short, high-density computer science lessons. One deck at a time, one idea per card."
    />
    <title>AntiBrainRot</title>
    <script>
      // Apply the saved (or OS-preferred) theme before the app renders so
      // there is no flash of the wrong theme on reload. The useTheme hook
      // owns the class from then on.
      (function () {
        try {
          var t = localStorage.getItem("antibrainrot:theme");
          if (t !== "dark" && t !== "light") {
            t =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          if (t === "dark") {
            document.documentElement.classList.add("dark");
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#14161a");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
