
# Runs once every day and asks the deployed backend to generate one new
# deck per pending topic. Using GitHub Actions decouples "when generation
# fires" from the backend's request path.
#
# Schedule: 10:30 UTC every day = 16:00 IST (4:00 PM), deliberately after
# the morning (06:30-09:30 IST) and afternoon (11:30-15:30 IST) usage
# peaks, so generation never competes with the busiest browsing hours and
# fresh decks are ready for the next morning. The backend independently
# enforces this window (no automatic run before 15:30 IST) and a one-run-
# per-IST-day guard, so the timing holds even if this cron drifts.
#
# To generate on demand (bypassing the time window and the once-a-day
# guard), call the endpoint manually with ?force=1:
#   curl -X POST "https://antibrainrot.onrender.com/api/generate?force=1" \
#     -H "Authorization: Bearer <GENERATION_SECRET>"

name: daily-generate

on:
  schedule:
    - cron: "30 10 * * *" # daily at 10:30 UTC = 16:00 IST, after the peaks

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger generation
        run: |
          curl -f -X POST https://antibrainrot.onrender.com/api/generate \
            -H "Authorization: Bearer ${{ secrets.GENERATION_SECRET }}" \
            -H "Content-Type: application/json"
